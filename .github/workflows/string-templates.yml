name: Quest string templates

on:
  push:
    paths:
      - 'src/utils/questStringTemplates.ts'
      - 'src/utils/questTranslation.ts'
      - 'src/components/QuestTranslationPanel.tsx'
      - 'src/components/translation/**'
      - 'src-tauri/src/app/translation*.rs'
      - 'src-tauri/src/editor/translation_bin.rs'
      - 'native-tests/**'
      - 'tests/questTranslation.test.mjs'
      - 'tests/questStringTemplates.test.mjs'
      - '.github/workflows/string-templates.yml'
  pull_request:
    paths:
      - 'src/utils/questStringTemplates.ts'
      - 'src/utils/questTranslation.ts'
      - 'src/components/QuestTranslationPanel.tsx'
      - 'src/components/translation/**'
      - 'src-tauri/src/app/translation*.rs'
      - 'src-tauri/src/editor/translation_bin.rs'
      - 'native-tests/**'
      - 'tests/questTranslation.test.mjs'
      - 'tests/questStringTemplates.test.mjs'
      - '.github/workflows/string-templates.yml'

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --experimental-test-coverage --test tests/*.test.mjs

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path native-tests/Cargo.toml

