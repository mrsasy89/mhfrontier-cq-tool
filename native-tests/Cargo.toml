[package]
name = "quest-translation-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["portable-tests"]
portable-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.31"
crc32fast = "1.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
path = "lib.rs"
